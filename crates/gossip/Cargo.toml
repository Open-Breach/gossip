[package]
name = "gossip"
description = "Follow Kubernetes pod logs and cluster events across restarts and rollouts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gossip"
path = "src/main.rs"

[dependencies]
gossip-core.workspace = true

anstyle.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
gossip-core = { workspace = true, features = ["testing"] }

tokio = { workspace = true, features = ["io-util", "process"] }
