[package]
name = "xtask"
description = "The tasks of the repository that are not the program: the generator of the README"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gossip = { path = "../gossip" }
gossip-core = { workspace = true, features = ["testing"] }

anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.2", features = ["pty", "termios"] }

[dev-dependencies]
toml.workspace = true
