name: release
# SPEC-release.md, section 2. A tag `v*` builds Gossip for four platforms,
# packs one archive per platform, tests each archive on a clean runner of
# its platform, and publishes a GitHub release with the archives and their
# checksums. A tag with a pre-release suffix (v0.2.0-rc1) is published as a
# pre-release.
#
# Run by hand with a tag name it is a dry run: the same build and the same
# tests, then a draft release under that name on the commit it ran on. The
# tag itself is only created if someone publishes the draft.
#
# The tag is the version: `gossip --version` in an archive prints it, and
# its release part must be the version of Cargo.toml.
#
# Runners: the labels come from the repository variables RUNNER_LINUX_X64,
# RUNNER_LINUX_ARM64, RUNNER_MACOS and RUNNER_WINDOWS; where one is not set,
# the job runs on GitHub's runner of that platform.
#
# deb, rpm, AUR, Homebrew and winget packages and an install script are not
# made here: Open-Breach/trebuchet takes them over from the same tag and the
# same archives.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Build as this tag (vX.Y.Z or vX.Y.Z-rcN); the release is created as a draft"
        required: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  # First, before anything is built: a release cut from a commit that is
  # another version stops here.
  check:
    name: the tag against the repository
    runs-on: ${{ vars.RUNNER_LINUX_X64 || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: the tag is the version of Cargo.toml
        run: .github/scripts/check-version.sh "$TAG"

  # The licence texts of every crate compiled into the binary, for the
  # archives. about.toml lists the four targets, so one run covers them all;
  # it fails when a crate has a licence about.toml does not accept. The
  # crate of the binary is named, so that no other crate of the workspace
  # and nothing only it needs gets into the list.
  licenses:
    name: third-party licences
    needs: check
    runs-on: ${{ vars.RUNNER_LINUX_X64 || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: the toolchain of rust-toolchain.toml
        run: rustup toolchain install || rustup show active-toolchain
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-about }
      - run: cargo about generate --manifest-path crates/gossip/Cargo.toml -c about.toml about.hbs -o THIRD-PARTY-LICENSES.html
      - uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.html
          if-no-files-found: error

  build:
    name: build ${{ matrix.platform }}
    needs: [check, licenses]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each on a runner of its own architecture: nothing is
          # cross-compiled. The Linux binaries are static (musl), so one
          # archive runs on every distribution.
          - { platform: linux-x64, target: x86_64-unknown-linux-musl, os: "${{ vars.RUNNER_LINUX_X64 || 'ubuntu-24.04' }}" }
          - { platform: linux-arm64, target: aarch64-unknown-linux-musl, os: "${{ vars.RUNNER_LINUX_ARM64 || 'ubuntu-24.04-arm' }}" }
          - { platform: macos-arm64, target: aarch64-apple-darwin, os: "${{ vars.RUNNER_MACOS || 'macos-latest' }}" }
          - { platform: windows-x64, target: x86_64-pc-windows-msvc, os: "${{ vars.RUNNER_WINDOWS || 'windows-latest' }}" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # ring compiles C for the target: with musl-tools that is musl-gcc.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      # README.md and LICENSE go into the archive as the repository has
      # them, byte for byte, on Windows too.
      - name: no conversion of line ends
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - name: the toolchain of rust-toolchain.toml, and the target
        shell: bash
        run: |
          rustup toolchain install || rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
      - name: musl
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - name: version
        shell: bash
        run: |
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "NAME=gossip-${TAG#v}-${{ matrix.platform }}" >> "$GITHUB_ENV"
      # The tag's version goes in through GOSSIP_VERSION: no file is edited
      # to make the binary report it (crates/gossip/build.rs).
      - name: build
        shell: bash
        run: GOSSIP_VERSION="$VERSION" cargo build --release --locked -p gossip --target "${{ matrix.target }}"
      - uses: actions/download-artifact@v8
        with: { name: third-party-licenses }
      # One top-level folder named like the archive: the binary, README.md
      # and LICENSE of this commit, and the third-party licences. Beside the
      # archive its checksum.
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/gossip$exe" "dist/$NAME/"
          cp README.md LICENSE THIRD-PARTY-LICENSES.html "dist/$NAME/"
          cd dist
          case "${{ runner.os }}" in
            Windows)
              7z a -tzip "$NAME.zip" "$NAME" > /dev/null
              archive="$NAME.zip"
              ;;
            macOS)
              chmod 755 "$NAME/gossip"
              # Without the extended attributes of macOS, which other
              # systems unpack as files of their own.
              COPYFILE_DISABLE=1 tar --no-xattrs --uid 0 --gid 0 --numeric-owner -czf "$NAME.tar.gz" "$NAME"
              archive="$NAME.tar.gz"
              ;;
            *)
              chmod 755 "$NAME/gossip"
              tar --owner=0 --group=0 --numeric-owner -czf "$NAME.tar.gz" "$NAME"
              archive="$NAME.tar.gz"
              ;;
          esac
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"
          rm -r "$NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  # Each archive as a user gets it, on a clean runner of its platform: no
  # checkout, no toolchain, no cluster.
  smoke:
    name: smoke test ${{ matrix.platform }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: "${{ vars.RUNNER_LINUX_X64 || 'ubuntu-24.04' }}" }
          - { platform: linux-arm64, os: "${{ vars.RUNNER_LINUX_ARM64 || 'ubuntu-24.04-arm' }}" }
          - { platform: macos-arm64, os: "${{ vars.RUNNER_MACOS || 'macos-latest' }}" }
          - { platform: windows-x64, os: "${{ vars.RUNNER_WINDOWS || 'windows-latest' }}" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with: { name: "archive-${{ matrix.platform }}", path: dist }
      - name: smoke test
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="gossip-$version-${{ matrix.platform }}"
          exe=""; archive="$name.tar.gz"
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; archive="$name.zip"; fi
          cd dist
          ls -l

          # 1. The archive against its checksum.
          if command -v sha256sum > /dev/null; then
            sha256sum -c "$archive.sha256"
          else
            shasum -a 256 -c "$archive.sha256"
          fi

          # 2. It unpacks to one folder that holds the four files, and
          # nothing else.
          mkdir unpacked && cd unpacked
          case "$archive" in
            *.zip) 7z x "../$archive" > /dev/null ;;
            *) tar xzf "../$archive" ;;
          esac
          test "$(ls -A)" = "$name" || { echo "the archive does not unpack to the one folder $name:"; ls -A; exit 1; }
          cd "$name"
          ls -l
          found="$(ls -A | LC_ALL=C sort | tr '\n' ' ')"
          expected="LICENSE README.md THIRD-PARTY-LICENSES.html gossip$exe "
          test "$found" = "$expected" || { echo "the folder holds: $found"; echo "expected:         $expected"; exit 1; }
          for file in LICENSE README.md THIRD-PARTY-LICENSES.html; do
            test -s "$file" || { echo "$file is empty"; exit 1; }
          done
          test -x "gossip$exe" || { echo "gossip$exe has lost its execute bit"; exit 1; }

          # 3. The version is the tag's.
          reported="$("./gossip$exe" --version | tr -d '\r')"
          echo "gossip --version: $reported"
          test "$reported" = "gossip $version" || { echo "expected: gossip $version"; exit 1; }

          # 4. The help of the program and of its two main commands.
          "./gossip$exe" --help > /dev/null
          "./gossip$exe" follow --help > /dev/null
          "./gossip$exe" list --help > /dev/null

          # 5. Linux: the binary is static, so it has no glibc floor.
          if [ "${{ runner.os }}" = "Linux" ]; then
            linked="$(ldd ./gossip 2>&1 || true)"
            echo "ldd: $linked"
            case "$linked" in
              *"statically linked"* | *"not a dynamic executable"*) ;;
              *) echo "the binary has dynamic dependencies"; exit 1 ;;
            esac
          fi
      # SPEC-release.md, acceptance 3: the Linux x64 binary starts on these
      # distributions as their images come, with nothing installed.
      - name: the binary starts on Debian, Ubuntu, Fedora and Alpine
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cd "dist/unpacked/gossip-$version-linux-x64"
          for image in debian:12 ubuntu:24.04 fedora:41 alpine:latest; do
            reported="$(docker run --rm -v "$PWD:/gossip:ro" "$image" /gossip/gossip --version)"
            echo "$image: $reported"
            test "$reported" = "gossip $version"
            docker run --rm -v "$PWD:/gossip:ro" "$image" /gossip/gossip follow --help > /dev/null
          done

  # Only when every smoke test passed.
  release:
    name: release
    needs: [build, smoke]
    runs-on: ${{ vars.RUNNER_LINUX_X64 || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { pattern: "archive-*", path: dist, merge-multiple: true }
      # The checksums of the builds merged into one file, sorted by file
      # name, in the format `sha256sum -c` reads.
      - name: checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cd dist
          cat ./*.sha256 | tr -d '\r' | sed 's/ \*/  /' | LC_ALL=C sort -k2 > SHA256SUMS.txt
          rm ./*.sha256
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          found="$(ls -A | LC_ALL=C sort | tr '\n' ' ')"
          expected="SHA256SUMS.txt gossip-$version-linux-arm64.tar.gz gossip-$version-linux-x64.tar.gz gossip-$version-macos-arm64.tar.gz gossip-$version-windows-x64.zip "
          test "$found" = "$expected" || { echo "the release would carry: $found"; echo "expected:                 $expected"; exit 1; }
          # Every archive, read here on Linux: one folder with the four files.
          for platform in linux-arm64 linux-x64 macos-arm64 windows-x64; do
            name="gossip-$version-$platform"
            if [ "$platform" = "windows-x64" ]; then
              listed="$(unzip -Z1 "$name.zip" | LC_ALL=C sort | tr '\n' ' ')"
              wanted="$name/ $name/LICENSE $name/README.md $name/THIRD-PARTY-LICENSES.html $name/gossip.exe "
            else
              listed="$(tar tzf "$name.tar.gz" | LC_ALL=C sort | tr '\n' ' ')"
              wanted="$name/ $name/LICENSE $name/README.md $name/THIRD-PARTY-LICENSES.html $name/gossip "
            fi
            test "$listed" = "$wanted" || { echo "$name holds: $listed"; echo "expected: $wanted"; exit 1; }
          done
          # README.md, LICENSE and the licences are the same files in all
          # four: none was changed on its way through a platform.
          for file in README.md LICENSE THIRD-PARTY-LICENSES.html; do
            sums="$(for platform in linux-arm64 linux-x64 macos-arm64; do
              tar xzOf "gossip-$version-$platform.tar.gz" "gossip-$version-$platform/$file" | sha256sum
            done; unzip -p "gossip-$version-windows-x64.zip" "gossip-$version-windows-x64/$file" | sha256sum)"
            test "$(printf '%s\n' "$sums" | sort -u | wc -l)" -eq 1 || { echo "$file differs between the archives:"; echo "$sums"; exit 1; }
          done
      # Title: the tag. Body: GitHub's generated notes since the previous
      # tag. A draft when run by hand, a pre-release for a tag with a suffix.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
