name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the stable toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      # SPEC-release.md 3: a build that is handed a version reports that
      # version. The tests above ran on a build without one.
      - name: the version of a release build
        run: test "$(GOSSIP_VERSION=9.9.9 cargo run --quiet -p gossip -- --version)" = "gossip 9.9.9"
